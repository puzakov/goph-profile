# PostgreSQL — метаданные аватарок, статусы обработки, таблица дедупликации.
#
# Deployment, а не StatefulSet: инстанс один, кластеризации и устойчивых
# сетевых имён не требуется — имя пода никому не нужно, сервис обращается
# по DNS сервиса `postgres`. PVC подключается как обычный том.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: goph-profile
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: goph-profile
spec:
  replicas: 1
  strategy:
    # Тома ReadWriteOnce: новый под должен занять том после удаления старого.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: goph-profile
    spec:
      # UID/GID образа postgres:16-alpine. fsGroup обязателен: без него
      # initdb не получит прав на запись в смонтированный том и под
      # не поднимется.
      #
      # Набор полей рассчитан на уровень restricted политики Pod Security
      # Admission, которой помечен namespace.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          # IfNotPresent: тег фиксирован, а локальному стенду незачем
          # сверяться с реестром на каждом старте пода.
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: goph-profile-secret, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: goph-profile-secret, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: goph-profile-secret, key: POSTGRES_DB }
            # Данные — в подкаталоге тома: корень смонтированного тома
            # может содержать служебные файлы (lost+found и подобные),
            # а initdb требует пустой каталог.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # Уровень контейнера: PostgreSQL слушает непривилегированный
          # порт 5432, capabilities ему не нужны.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "goph", "-d", "goph"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "goph", "-d", "goph"]
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: goph-profile
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: goph-profile
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
