# Несекретная конфигурация приложения: читается подами через envFrom.
# Имена ключей совпадают с переменными окружения из internal/config.
apiVersion: v1
kind: ConfigMap
metadata:
  name: goph-profile-config
  namespace: goph-profile
  labels:
    app.kubernetes.io/part-of: goph-profile
data:
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # server: HTTP API и статика веб-интерфейса.
  HTTP_ADDR: ":8080"
  STATIC_DIR: "/app/web/static"

  # worker: /metrics на отдельном порту.
  METRICS_ADDR: ":9091"

  # S3-совместимое хранилище — MinIO внутри кластера.
  S3_ENDPOINT: "minio:9000"
  S3_BUCKET: "avatars"
  S3_REGION: "us-east-1"
  S3_USE_SSL: "false"

  # Пусто — трейсинг выключен (no-op провайдер): Jaeger в этот стенд
  # не входит. Адрес коллектора задаётся, если он развёрнут рядом.
  OTEL_EXPORTER_OTLP_ENDPOINT: ""

  # RabbitMQ Management API — источник метрик очередей у воркера.
  # Порт 15672 открыт только внутри кластера.
  RABBITMQ_MANAGEMENT_URL: "http://rabbitmq:15672"
  RABBITMQ_MANAGEMENT_USER: "guest"
  # Пароль management API в ConfigMap — компромисс dev-стенда.
  # В продакшене переносится в Secret (см. values-prod.yaml).
  RABBITMQ_MANAGEMENT_PASSWORD: "guest"

  # Ограничение частоты REST API: токенов в секунду на клиента (X-User-ID
  # или IP) и размер всплеска. RATE_LIMIT_RPS: "0" отключает ограничение.
  RATE_LIMIT_RPS: "20"
  RATE_LIMIT_BURST: "40"
