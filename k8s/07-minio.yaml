# MinIO — S3-совместимое хранилище файлов аватарок и миниатюр.
#
# Наружу (за пределы кластера) отдаётся только S3 API на 9000.
# Консоль на 9001 слушает внутри пода и в сервис не включена: для отладки
# достаточно `kubectl port-forward`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: goph-profile
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: goph-profile
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: goph-profile
    spec:
      # UID 1000 — пользователь minio-user в официальном образе.
      # fsGroup нужен, чтобы под мог писать в смонтированный том.
      # Набор полей рассчитан на уровень restricted политики Pod Security
      # Admission, которой помечен namespace.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:latest
          # IfNotPresent: для тега latest Kubernetes по умолчанию ставит
          # Always и идёт в реестр, минуя локальную копию. Образ MinIO
          # с Docker Hub удалён, поэтому берётся из кэша кластера —
          # см. заметку про MinIO в README.
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: { name: goph-profile-secret, key: MINIO_ROOT_USER }
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: goph-profile-secret, key: MINIO_ROOT_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          # Уровень контейнера: MinIO слушает непривилегированный порт 9000.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: goph-profile
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: goph-profile
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
