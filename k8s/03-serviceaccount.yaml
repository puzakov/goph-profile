# Service account для подов приложения и Job'а миграций.
#
# Ролей и привязок нет намеренно: сервис не обращается к API Kubernetes
# (нет клиента, лидер-элекции и чтения чужих ресурсов) — разрешать нечего.
# Минимальные права здесь означают полное их отсутствие; добавление
# Role/RoleBinding «на будущее» расширило бы поверхность атаки.
#
# Токен не монтируется по той же причине: под без файла токена нельзя
# использовать для доступа к API даже при компрометации контейнера.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: goph-profile
  namespace: goph-profile
  labels:
    app.kubernetes.io/part-of: goph-profile
automountServiceAccountToken: false
