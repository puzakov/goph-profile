# Секреты стенда: пароли БД, брокера и S3, а также строки подключения.
#
# ЗНАЧЕНИЯ ЗДЕСЬ — ДЕМОНСТРАЦИОННЫЕ и подходят только для локального
# minikube. Для реального окружения секреты создаются вне git (например,
# External Secrets / SOPS) или через `kubectl create secret` из CI.
#
# stringData вместо data: Kubernetes сам кодирует значения в base64 —
# руками кодировать нечего, файл остаётся читаемым при ревью.
apiVersion: v1
kind: Secret
metadata:
  name: goph-profile-secret
  namespace: goph-profile
  labels:
    app.kubernetes.io/part-of: goph-profile
type: Opaque
stringData:
  # Приложение.
  DATABASE_URL: postgres://goph:goph@postgres:5432/goph?sslmode=disable
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin

  # Инфраструктура: те же учётные данные, что и в строках подключения выше.
  POSTGRES_USER: goph
  POSTGRES_PASSWORD: goph
  POSTGRES_DB: goph
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin
  # Задано явно: без этого guest ограничен подключениями с localhost
  # и приложение из другого пода получить доступ не сможет.
  RABBITMQ_DEFAULT_USER: guest
  RABBITMQ_DEFAULT_PASSWORD: guest
