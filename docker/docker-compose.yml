# Локальный стенд GophProfile: PostgreSQL + MinIO + RabbitMQ + сервер + воркер.
# Запуск: docker compose -f docker/docker-compose.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goph}
      POSTGRES_DB: ${POSTGRES_DB:-goph}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goph -d goph"]
      interval: 3s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # веб-консоль управления
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # веб-консоль
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 15

  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://goph:goph@postgres:5432/goph?sslmode=disable
      STATIC_DIR: /app/web/static
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: avatars
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      # Наблюдаемость: логи, трейсинг, метрики на /metrics.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["worker"]
    environment:
      DATABASE_URL: postgres://goph:goph@postgres:5432/goph?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: avatars
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      # Наблюдаемость: логи, трейсинг, метрики на отдельном порту.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      METRICS_ADDR: ":9091"
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
      RABBITMQ_MANAGEMENT_USER: guest
      RABBITMQ_MANAGEMENT_PASSWORD: guest
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "9091:9091"   # /metrics воркера

volumes:
  pgdata:
  miniodata:

# Общая сеть с мониторинг-стендом (docker/docker-compose.monitoring.yml):
# Prometheus и Jaeger обращаются к сервисам по именам контейнеров.
networks:
  default:
    name: goph_default
