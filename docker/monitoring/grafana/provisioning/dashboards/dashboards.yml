# Провайдер дашбордов: JSON-файлы монтируются в /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: GophProfile
    orgId: 1
    folder: GophProfile
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
