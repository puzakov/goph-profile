# Источники данных Grafana: метрики, трейсы, логи.
apiVersion: 1

datasources:
  # Exemplars (trace_id рядом с точкой метрики) не настраиваем: клиент
  # Prometheus в Go их не отдаёт. Связь «метрика → трейс» даёт переход
  # из логов Loki по trace_id, а трейсы ищутся в Jaeger напрямую.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Переход из лога в трейс по полю trace_id (см. promtail.yml).
      derivedFields:
        - name: trace_id
          matcherRegex: '"trace_id":"(\w+)"'
          datasourceUid: jaeger
          url: "$${__value.raw}"
          urlDisplayLabel: Открыть трейс в Jaeger
