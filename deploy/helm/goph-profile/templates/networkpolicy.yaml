{{- if .Values.networkPolicy.enabled }}
{{- $server := include "goph-profile.componentName" (dict "root" . "component" "server") }}
{{- $worker := include "goph-profile.componentName" (dict "root" . "component" "worker") }}
{{- $postgres := include "goph-profile.componentName" (dict "root" . "component" "postgres") }}
{{- $rabbitmq := include "goph-profile.componentName" (dict "root" . "component" "rabbitmq") }}
{{- $minio := include "goph-profile.componentName" (dict "root" . "component" "minio") }}
# Сетевые политики: микросегментация внутри namespace.
#
# ВАЖНО: правила применяются только там, где их поддерживает CNI (Calico,
# Cilium). С CNI по умолчанию в minikube манифесты создадутся, но трафик
# ограничивать не будут — поэтому по умолчанию они выключены
# (networkPolicy.enabled, включено в values-prod).
#
# Принцип: по умолчанию запрещено всё, дальше разрешается только нужное.
{{- if .Values.postgres.enabled }}
---
# PostgreSQL принимает подключения только от подов приложения.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $postgres }}
  labels:
    {{- include "goph-profile.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "goph-profile.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    # part-of проставлен всем подам приложения, включая Job миграций.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: goph-profile
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- if .Values.rabbitmq.enabled }}
---
# RabbitMQ: AMQP для приложения, Management API — воркеру,
# который собирает метрики очередей.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $rabbitmq }}
  labels:
    {{- include "goph-profile.componentLabels" (dict "root" . "component" "rabbitmq") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "goph-profile.componentSelectorLabels" (dict "root" . "component" "rabbitmq") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: goph-profile
      ports:
        - protocol: TCP
          port: 5672
        - protocol: TCP
          port: 15672
{{- end }}
{{- if .Values.minio.enabled }}
---
# MinIO принимает S3-трафик только от подов приложения.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $minio }}
  labels:
    {{- include "goph-profile.componentLabels" (dict "root" . "component" "minio") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "goph-profile.componentSelectorLabels" (dict "root" . "component" "minio") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: goph-profile
      ports:
        - protocol: TCP
          port: 9000
{{- end }}
---
# Сервер: входящий трафик от ingress-контроллера и Prometheus,
# исходящий — только к своим зависимостям и DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $server }}
  labels:
    {{- include "goph-profile.componentLabels" (dict "root" . "component" "server") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "goph-profile.componentSelectorLabels" (dict "root" . "component" "server") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # Внешние запросы приходят через ingress-nginx. Лейбл
    # kubernetes.io/metadata.name проставляется кластером автоматически
    # (Kubernetes 1.21+), помечать namespace вручную не нужно.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNginxNamespace }}
      ports:
        - protocol: TCP
          port: 8080
    # Скрейп /metrics.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Разрешение имён: без CoreDNS сервис не найдёт ни одну зависимость.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "goph-profile.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- if .Values.rabbitmq.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "goph-profile.componentSelectorLabels" (dict "root" . "component" "rabbitmq") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5672
    {{- end }}
    {{- if .Values.minio.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "goph-profile.componentSelectorLabels" (dict "root" . "component" "minio") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
    {{- end }}
---
# Воркер: наружу отдаёт только /metrics для Prometheus; ходит в те же
# зависимости плюс Management API брокера.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $worker }}
  labels:
    {{- include "goph-profile.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "goph-profile.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - protocol: TCP
          port: 9091
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- if .Values.postgres.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "goph-profile.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5432
    {{- end }}
    {{- if .Values.rabbitmq.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "goph-profile.componentSelectorLabels" (dict "root" . "component" "rabbitmq") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 5672
        # Management API — источник метрик очередей.
        - protocol: TCP
          port: 15672
    {{- end }}
    {{- if .Values.minio.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "goph-profile.componentSelectorLabels" (dict "root" . "component" "minio") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 9000
    {{- end }}
{{- end }}
