# Секреты приложения и инфраструктуры.
#
# Значения по умолчанию в values.yaml — демонстрационные, для локального
# кластера. Реальные значения передаются при установке:
#   helm upgrade --install ... --set secrets.postgresPassword=... \
#                                --set secrets.rabbitmqDefaultPassword=...
# либо внешним менеджером секретов. Хранить их в values-файле репозитория
# нельзя: Helm пишет values в открытом виде в собственный Secret релиза.
#
# Строки подключения собираются из компонентов ниже, если не заданы явно.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "goph-profile.fullname" . }}-secret
  labels:
    {{- include "goph-profile.componentLabels" (dict "root" . "component" "secret") | nindent 4 }}
type: Opaque
data:
  DATABASE_URL: {{ include "goph-profile.databaseUrl" . | b64enc | quote }}
  RABBITMQ_URL: {{ include "goph-profile.rabbitmqUrl" . | b64enc | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.minioRootUser | b64enc | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.minioRootPassword | b64enc | quote }}

  POSTGRES_USER: {{ .Values.secrets.postgresUser | b64enc | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | b64enc | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | b64enc | quote }}
  MINIO_ROOT_USER: {{ .Values.secrets.minioRootUser | b64enc | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | b64enc | quote }}
  RABBITMQ_DEFAULT_USER: {{ .Values.secrets.rabbitmqDefaultUser | b64enc | quote }}
  RABBITMQ_DEFAULT_PASSWORD: {{ .Values.secrets.rabbitmqDefaultPassword | b64enc | quote }}
