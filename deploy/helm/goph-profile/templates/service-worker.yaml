{{- $name := include "goph-profile.componentName" (dict "root" . "component" "worker") }}
# Сервис воркера нужен только для скрейпа метрик: клиентский трафик
# на воркер не маршрутизируется.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "goph-profile.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  selector:
    {{- include "goph-profile.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 4 }}
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
