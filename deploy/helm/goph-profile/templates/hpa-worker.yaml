{{- if .Values.worker.hpa.enabled }}
# Воркер масштабируется только по CPU: ресайз и JPEG-кодирование упираются
# в процессор, а память определяется размером одного файла, а не глубиной
# очереди. Дополнительные консьюмеры на тех же очередях безопасны — это
# конкурирующие потребители, обработка идемпотентна по message_id.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "goph-profile.componentName" (dict "root" . "component" "worker") }}
  labels:
    {{- include "goph-profile.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "goph-profile.componentName" (dict "root" . "component" "worker") }}
  minReplicas: {{ .Values.worker.hpa.minReplicas }}
  maxReplicas: {{ .Values.worker.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.worker.hpa.cpuUtilization }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: {{ .Values.worker.hpa.scaleDownStabilizationSeconds }}
{{- end }}
