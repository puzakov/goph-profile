{{- if .Values.serviceAccount.create }}
# Service account подов приложения и Job'а миграций.
#
# Ролей и привязок нет намеренно: сервис не обращается к API Kubernetes
# (нет клиента, лидер-элекции, чтения чужих ресурсов) — разрешать нечего.
# Права выдаются по факту необходимости, а не авансом.
#
# Токен не монтируется (serviceAccount.automountServiceAccountToken):
# без файла токена под не сможет обратиться к API даже при компрометации
# контейнера. Включайте его только вместе с Role/RoleBinding, когда
# приложению действительно понадобится API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "goph-profile.serviceAccountName" . }}
  labels:
    {{- include "goph-profile.componentLabels" (dict "root" . "component" "sa") | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
